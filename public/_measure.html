<!doctype html><meta charset=utf8><title>measure</title>
<style>body{font:13px/1.6 system-ui;padding:20px;background:#faf9f7}
td{padding:4px 14px 4px 0}b{color:#0a7}</style>
<h3>Does a pasted product resize the piece?</h3>
<div id=out>running…</div>
<script type="module">
import { requestFacts, applyFacts } from '/src/data/productFacts.js'
const rows = []
const CASES = [
  ['sofa',      'KIVIK sofa',        'https://www.ikea.com/us/en/p/kivik-sofa-tibbleby-beige-gray-s39440593/', { h: 0.84, fp: 1.05, color: '#8A8A86' }],
  ['bookcase',  'BILLY bookcase',    'https://www.ikea.com/us/en/p/billy-bookcase-white-90522043/',            { h: 2.0,  fp: 0.42, color: '#E8E4DC' }],
  ['sofa',      'KIVIK anthracite',  'https://www.ikea.com/us/en/p/kivik-sofa-tresund-anthracite-s39482837/',  { h: 0.84, fp: 1.05, color: '#8A8A86' }],
]
for (const [model, label, sourceUrl, base] of CASES) {
  const item = { ...base, model, sourceUrl, name: label }
  const facts = await requestFacts(item)
  const after = applyFacts(item, facts)
  rows.push(`<tr><td><b>${label}</b></td>
    <td>estimate: h=${item.h}m fp=${item.fp}m ${item.color}</td>
    <td>→ measured: h=${after.h}m w=${after.wM ?? '?'}m d=${after.dM ?? '?'}m fp=${after.fp}m
        <span style="background:${after.color};padding:0 10px;border:1px solid #999">&nbsp;</span> ${after.color}</td>
    <td>${after.measured ? '<b>real</b>' : 'unchanged'}</td></tr>`)
}
document.getElementById('out').innerHTML = '<table>' + rows.join('') + '</table>'
</script>
